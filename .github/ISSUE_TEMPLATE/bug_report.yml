name: Bug report
description: 报告可复现的问题
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先跑 `koubo doctor`，并把结果贴上来。**不要贴真实客户素材、成片或带个人信息的路径。**
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 实际结果 vs 预期结果
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. koubo new ...
        2. koubo run ...
        3. 看到 ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: koubo doctor 输出
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / 系统
      placeholder: "koubo 1.0.0 / macOS 15.3 / Python 3.12"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 命令输出、work/qc-report.json 片段（记得脱敏）
      render: text
    validations:
      required: false

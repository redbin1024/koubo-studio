<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;overflow:hidden}
canvas{display:block;width:800px;height:1000px}
</style></head><body>
<canvas id="c" width="800" height="1000"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
function curl(cx,base,h,phase,w){
  x.beginPath();
  for(let i=0;i<=40;i++){
    const p=i/40, y=base-p*h;
    const dx=Math.sin(p*6.2+phase)*w*(0.25+p*0.75);
    if(i===0)x.moveTo(cx+dx,y);else x.lineTo(cx+dx,y);
  }
  x.strokeStyle='rgba(255,248,232,0.72)';
  x.lineWidth=7; x.lineCap='round'; x.stroke();
}
window.renderAt=function(t){
  x.clearRect(0,0,800,1000);
  const ph=t*1.7;
  for(let i=0;i<5;i++){
    const cx=300+i*56, base=700-i*8, h=190+((i*37)%50);
    curl(cx,base,h,ph+i*0.7,18+i*2);
  }
};
window.renderAt(0);
</script></body></html>

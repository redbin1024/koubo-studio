<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="a"><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
      <feComposite in="a" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF4E7"/><stop offset="1" stop-color="#EFE2CE"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6EBD8"/><stop offset="1" stop-color="#D9C3A2"/>
    </linearGradient>
  </defs>

  <!-- warm table -->
  <path d="M0 735 Q400 690 800 735 L800 1000 L0 1000 Z" fill="url(#cloth)"/>
  <path d="M0 735 Q400 690 800 735" fill="none" stroke="#D9C3A2" stroke-width="3"/>
  <path d="M90 782 Q400 735 710 782" fill="none" stroke="#E5D3B8" stroke-width="2" opacity=".8"/>

  <!-- window light -->
  <path d="M40 90 L300 40 L360 610 L0 690 Z" fill="#FFF8EA" opacity=".55" filter="url(#soft)"/>
  <path d="M300 40 L520 20 L600 560 L360 610 Z" fill="#FFF3D8" opacity=".35" filter="url(#soft)"/>

  <!-- tray shadow -->
  <ellipse cx="400" cy="812" rx="292" ry="78" fill="#8A6A4E" opacity=".18" filter="url(#soft)"/>
  <!-- tray -->
  <ellipse cx="400" cy="785" rx="300" ry="92" fill="#B98A56"/>
  <ellipse cx="400" cy="772" rx="300" ry="92" fill="#E8C892"/>
  <ellipse cx="400" cy="772" rx="264" ry="74" fill="#F8EAD1"/>
  <path d="M108 774 Q400 700 692 774" fill="none" stroke="#C79A62" stroke-width="3" opacity=".7"/>
  <!-- handles -->
  <path d="M100 772 Q70 760 68 740 Q66 720 88 716" fill="none" stroke="#B98A56" stroke-width="12" stroke-linecap="round"/>
  <path d="M700 772 Q730 760 732 740 Q734 720 712 716" fill="none" stroke="#B98A56" stroke-width="12" stroke-linecap="round"/>

  <!-- main cloche -->
  <ellipse cx="400" cy="694" rx="176" ry="28" fill="#8A6A4E" opacity=".16" filter="url(#soft)"/>
  <path d="M244 690 Q244 532 400 522 Q556 532 556 690 Z" fill="url(#steel)" stroke="#9C774E" stroke-width="3"/>
  <path d="M276 688 Q280 566 400 552" fill="none" stroke="#FFF9ED" stroke-width="10" opacity=".65" stroke-linecap="round"/>
  <ellipse cx="400" cy="690" rx="156" ry="20" fill="#E7D1AE" stroke="#9C774E" stroke-width="3"/>
  <path d="M400 522 L400 498" stroke="#9C774E" stroke-width="8" stroke-linecap="round"/>
  <circle cx="400" cy="490" r="18" fill="#D8B36A" stroke="#9C774E" stroke-width="3"/>

  <!-- steam -->
  <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity=".75">
    <path d="M338 470 C320 430 356 410 340 370 C326 334 352 320 344 292"/>
    <path d="M400 462 C382 416 420 394 404 352 C390 316 414 300 408 274"/>
    <path d="M462 470 C446 432 482 412 468 374 C456 342 480 326 474 300"/>
  </g>

  <!-- side bowls -->
  <g>
    <ellipse cx="248" cy="734" rx="78" ry="24" fill="#8A6A4E" opacity=".14" filter="url(#soft)"/>
    <path d="M184 720 Q188 758 248 758 Q308 758 312 720 Z" fill="#F4E5CE" stroke="#9C774E" stroke-width="3"/>
    <ellipse cx="248" cy="720" rx="64" ry="17" fill="#D9B98B" stroke="#9C774E" stroke-width="3"/>
    <ellipse cx="248" cy="716" rx="44" ry="10" fill="#8FA36B"/>
    <path d="M226 708 Q248 698 270 708" fill="none" stroke="#6F8451" stroke-width="3"/>
  </g>
  <g>
    <ellipse cx="552" cy="736" rx="76" ry="23" fill="#8A6A4E" opacity=".14" filter="url(#soft)"/>
    <path d="M490 722 Q494 758 552 758 Q610 758 614 722 Z" fill="#F4E5CE" stroke="#9C774E" stroke-width="3"/>
    <ellipse cx="552" cy="722" rx="62" ry="16" fill="#D9B98B" stroke="#9C774E" stroke-width="3"/>
    <ellipse cx="552" cy="718" rx="42" ry="9" fill="#C97C5C"/>
    <path d="M530 710 Q552 700 574 710" fill="none" stroke="#A75C42" stroke-width="3"/>
  </g>

  <!-- chopsticks / spoon -->
  <g stroke="#8A5A3B" stroke-width="6" stroke-linecap="round">
    <path d="M598 610 L690 688"/><path d="M612 596 L706 674"/>
    <path d="M596 612 L686 694"/>
  </g>
  <g>
    <path d="M158 648 Q196 650 204 690 Q210 724 178 730" fill="none" stroke="#B98A56" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="174" cy="728" rx="24" ry="16" fill="#E8C892" stroke="#9C774E" stroke-width="3"/>
  </g>

  <!-- linen -->
  <path d="M618 790 Q660 770 704 790 Q712 836 680 852 Q636 848 618 816 Z" fill="#FBF4E7" stroke="#D9C3A2" stroke-width="3"/>
  <path d="M634 800 Q662 786 690 800" fill="none" stroke="#E5D3B8" stroke-width="3"/>
  <path d="M640 820 Q664 810 686 820" fill="none" stroke="#E5D3B8" stroke-width="3"/>

  <!-- small herb sprig -->
  <g stroke="#6F8451" stroke-width="4" fill="#8FA36B" stroke-linecap="round">
    <path d="M120 700 Q160 660 198 650"/>
    <ellipse cx="156" cy="674" rx="16" ry="9" transform="rotate(-35 156 674)"/>
    <ellipse cx="178" cy="660" rx="14" ry="8" transform="rotate(-30 178 660)"/>
    <ellipse cx="136" cy="690" rx="12" ry="7" transform="rotate(-40 136 690)"/>
  </g>

  <!-- paper grain -->
  <rect width="800" height="1000" filter="url(#grain)" opacity=".55"/>
</svg>

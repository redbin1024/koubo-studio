<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
<defs>
<filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="41" result="n"/><feColorMatrix in="n" type="saturate" values="0" result="s"/><feComponentTransfer in="s" result="a"><feFuncA type="linear" slope=".05"/></feComponentTransfer><feComposite in="a" in2="SourceGraphic" operator="in"/></filter>
<linearGradient id="light" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF8E8"/><stop offset="1" stop-color="#F4D9A9"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#EAD8BE"/><stop offset="1" stop-color="#D6BE9F"/></linearGradient>
<filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
</defs>
<rect width="800" height="1000" fill="#F7EEDF"/>
<!-- wall -->
<rect x="0" y="0" width="800" height="790" fill="#F1E2CC"/>
<!-- doorway light -->
<path d="M230 180 H570 V790 H230Z" fill="url(#light)"/>
<path d="M255 205 H545 V790 H255Z" fill="#FFF9EC" opacity=".75"/>
<!-- door frame -->
<path d="M205 160 H595 V790 H205Z" fill="none" stroke="#B78E5C" stroke-width="18"/>
<path d="M205 160 H595" stroke="#9C774E" stroke-width="22"/>
<!-- open door -->
<path d="M570 210 L730 300 L730 790 L570 790Z" fill="#D8B68A" stroke="#9C774E" stroke-width="6"/>
<path d="M600 340 H700 M600 420 H700 M600 500 H700" stroke="#C79A62" stroke-width="5"/>
<circle cx="700" cy="560" r="10" fill="#8A5A3B"/>
<!-- floor -->
<rect x="0" y="790" width="800" height="210" fill="url(#floor)"/>
<path d="M0 790 H800" stroke="#D6BE9F" stroke-width="3"/>
<!-- light pool -->
<ellipse cx="430" cy="880" rx="300" ry="60" fill="#FFF6DF" opacity=".65" filter="url(#soft)"/>
<!-- plant -->
<g stroke="#6F8451" stroke-width="6" fill="#8FA36B">
<path d="M680 760 Q690 650 680 570"/><path d="M680 690 Q630 650 610 600"/><path d="M680 650 Q730 610 750 570"/>
<ellipse cx="618" cy="612" rx="28" ry="15" transform="rotate(-35 618 612)"/><ellipse cx="742" cy="585" rx="30" ry="15" transform="rotate(28 742 585)"/>
</g>
<path d="M640 760 L730 760 L715 820 L655 820Z" fill="#B9824A" stroke="#8A5A3B" stroke-width="3"/>
<!-- mat -->
<path d="M170 860 Q400 820 630 860 L610 940 Q400 910 190 940Z" fill="#E8D3B6" stroke="#C79A62" stroke-width="3"/>
<path d="M210 875 Q400 845 590 875" fill="none" stroke="#D6BE9F" stroke-width="3"/>
<rect width="800" height="1000" filter="url(#g)" opacity=".5"/>
</svg>

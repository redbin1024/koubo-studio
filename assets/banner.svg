<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="口播工坊 Koubo Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#141A33"/>
      <stop offset="1" stop-color="#251B33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5E14A"/>
      <stop offset="0.55" stop-color="#FF8A5B"/>
      <stop offset="1" stop-color="#FF6284"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#FF6284" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FF6284" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>
  <circle cx="1010" cy="96" r="92" fill="#FF6284" opacity="0.10" filter="url(#soft)"/>
  <circle cx="1080" cy="300" r="120" fill="#F5E14A" opacity="0.07" filter="url(#soft)"/>

  <!-- 左侧品牌 -->
  <g transform="translate(72 108)">
    <rect x="0" y="0" width="54" height="54" rx="14" fill="url(#accent)"/>
    <path d="M16 17 L16 37 L34 27 Z" fill="#0B1020"/>
    <text x="74" y="30" font-family="PingFang SC, Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">口播工坊</text>
    <text x="74" y="60" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="3" fill="#9BA3C7">KOUBO STUDIO</text>
    <text x="0" y="118" font-family="PingFang SC, Noto Sans CJK SC, Noto Sans SC, sans-serif" font-size="26" font-weight="600" fill="#E7E9F5">量参考片 · 剪口播 · 出成片 + 剪映草稿</text>
    <text x="0" y="160" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="17" fill="#8E97BE">measure → rough cut → captions → style → QC</text>
    <g transform="translate(0 196)">
      <rect width="132" height="30" rx="15" fill="#FFFFFF" opacity="0.08"/>
      <text x="16" y="21" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#DDE1F2">ffmpeg + Pillow</text>
      <rect x="144" width="132" height="30" rx="15" fill="#FFFFFF" opacity="0.08"/>
      <text x="160" y="21" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#DDE1F2">剪映草稿</text>
      <rect x="288" width="132" height="30" rx="15" fill="#FFFFFF" opacity="0.08"/>
      <text x="304" y="21" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" fill="#DDE1F2">三态质检</text>
    </g>
  </g>

  <!-- 右侧流程卡 -->
  <g transform="translate(706 66)">
    <rect width="426" height="268" rx="28" fill="#FFFFFF" opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="30" y="48" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#8E97BE">ONE RUN, TWO DELIVERABLES</text>

    <g transform="translate(30 76)">
      <rect width="366" height="44" rx="12" fill="#0B1020" opacity="0.55"/>
      <circle cx="22" cy="22" r="8" fill="#F5E14A"/>
      <text x="42" y="27" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#F4F5FA">参考片 → 实测几何 / 配色 / 字幕带</text>
    </g>
    <g transform="translate(30 128)">
      <rect width="366" height="44" rx="12" fill="#0B1020" opacity="0.55"/>
      <circle cx="22" cy="22" r="8" fill="#FF8A5B"/>
      <text x="42" y="27" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#F4F5FA">粗剪 · 字幕 · 包装 · 旁白 / BGM / 音效</text>
    </g>
    <g transform="translate(30 180)">
      <rect width="176" height="56" rx="14" fill="#F5E14A"/>
      <text x="18" y="24" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#141A33">成片 mp4</text>
      <text x="18" y="44" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#4A3B0E">final-1080x1920.mp4</text>
      <rect x="190" width="176" height="56" rx="14" fill="#FF6284"/>
      <text x="208" y="24" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#2A0B16">剪映草稿</text>
      <text x="208" y="44" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="11" fill="#5C1730">能继续改的工程</text>
    </g>
  </g>
</svg>

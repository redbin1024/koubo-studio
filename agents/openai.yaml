name: koubo-studio
display_name: 口播工坊 Koubo Studio
short_description: 以剪映草稿为主交付：逐镜头可编辑草稿 + mp4 预览，也可逐步控制
description: |
  面向口播与多段 Vlog 的可审核智能剪辑工作流，以剪映草稿为主交付。支持 koubo auto
  一条命令从原始素材出逐镜头可编辑草稿 + mp4 预览：本地规则打底，DeepSeek 或当前窗口的
  宿主 Agent 做选段/排序/高亮/故事线；自动 ASR 字幕、无声素材 TTS 旁白、BGM/音效、
  三态质检与常见红项自动修复。草稿主轨逐镜头切段，字幕/人声/音效/BGM 分轨，转场/滤镜/
  关键帧/蒙版回到剪映做。也保留逐步手工流程：量参考片 → ffmpeg + Pillow 逐帧合成 →
  可在剪映里继续编辑的草稿。默认去标点、不做封面、不做片尾卡。
